name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test Actions reference convention
        run: .github/scripts/check-actions-convention_test.sh

      - name: Check Actions reference convention
        run: .github/scripts/check-actions-convention.sh

      - uses: raven-actions/actionlint@v2

  check:
    needs: actionlint
    uses: ectobit/reusable-workflows/.github/workflows/go-check.yaml@main

  test:
    needs: actionlint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mig
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mig"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - run: make test
